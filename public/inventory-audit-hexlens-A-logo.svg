<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <defs>
    <linearGradient id="gA" x1="0.6" y1="0" x2="0.3" y2="1"><stop offset="0" stop-color="#22a866"/><stop offset="0.45" stop-color="#127a52"/><stop offset="1" stop-color="#0c1b3d"/></linearGradient>
    <linearGradient id="gB" x1="0.2" y1="0" x2="0.8" y2="1"><stop offset="0" stop-color="#22a866"/><stop offset="1" stop-color="#0f4f5c"/></linearGradient>
    <linearGradient id="gt" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#22a866"/><stop offset="1" stop-color="#127a52"/></linearGradient>
    <linearGradient id="gl" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#16376a"/><stop offset="1" stop-color="#0c1b3d"/></linearGradient>
    <linearGradient id="gr" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#157a58"/><stop offset="1" stop-color="#0f4f5c"/></linearGradient>
    <g id="cube">
      <polygon points="0,0 69,40 0,80 -69,40" fill="url(#gt)"/>
      <polygon points="-69,40 0,80 0,160 -69,120" fill="url(#gl)"/>
      <polygon points="0,80 69,40 69,120 0,160" fill="url(#gr)"/>
    </g>
  </defs>
  <rect width="800" height="800" fill="#ffffff"/>

  <!-- hexagon lens -->
  <polygon points="400,110 590.5,220 590.5,440 400,550 209.5,440 209.5,220" fill="#f1faf5" stroke="#0f2a50" stroke-width="22" stroke-linejoin="round"/>
  <polygon points="400,150 556,240 556,420 400,510 244,420 244,240" fill="none" stroke="#22a866" stroke-width="3" stroke-dasharray="4 10" stroke-linecap="round"/>

  <!-- your A logo inside, with chained blocks across the crossbar -->
  <g transform="translate(400 330) scale(0.62) translate(-400 -342)">
    <polygon points="418,155 320,220 344,232 192,530 240,530 405,265" fill="url(#gA)"/>
    <polygon points="424,157 607,530 524,530 408,282" fill="url(#gB)"/>
    <path d="M212 512 Q262 440 336 424" fill="none" stroke="#0c1b3d" stroke-width="13" stroke-linecap="round"/>
    <g fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="440,222 452,250 462,268 470,300"/>
      <polyline points="468,262 482,300 494,320"/>
      <polyline points="500,372 520,398 540,424 556,470"/>
      <polyline points="520,350 536,372 566,380"/>
      <circle cx="438" cy="219" r="6"/><circle cx="470" cy="304" r="6"/><circle cx="494" cy="324" r="6"/>
      <circle cx="556" cy="474" r="6"/><circle cx="569" cy="381" r="6"/>
    </g>
    <g transform="translate(419 386) rotate(-34)" fill="none" stroke-width="8" stroke-linecap="round">
      <rect x="-24" y="-9" width="32" height="18" rx="9" stroke="#22a866"/>
      <rect x="-8" y="-9" width="32" height="18" rx="9" stroke="#0f2a50"/>
    </g>
    <g stroke="#fff" stroke-width="8" stroke-linejoin="round">
      <use href="#cube" transform="translate(478 320) scale(.55)"/>
      <use href="#cube" transform="translate(360 365) scale(.55)"/>
    </g>
    <use href="#cube" transform="translate(478 320) scale(.55)"/>
    <use href="#cube" transform="translate(360 365) scale(.55)"/>
    <g fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M466 342 L477 354 L494 332"/>
      <path d="M348 387 L359 399 L376 377"/>
    </g>
  </g>

  <!-- chain-link handle -->
  <g fill="none" stroke-width="9" stroke-linecap="round">
    <g transform="translate(630 480) rotate(45)"><rect x="-34" y="-12" width="68" height="24" rx="12" stroke="#0f2a50"/></g>
    <g transform="translate(657 507) rotate(45)"><rect x="-34" y="-12" width="68" height="24" rx="12" stroke="#22a866"/></g>
  </g>
  <circle cx="692" cy="542" r="15" fill="#0f2a50"/>

  <!-- vertex nodes -->
  <g fill="#22a866" stroke="#fff" stroke-width="6">
    <circle cx="400" cy="110" r="24"/><circle cx="590.5" cy="220" r="24"/><circle cx="590.5" cy="440" r="24"/>
    <circle cx="400" cy="550" r="24"/><circle cx="209.5" cy="440" r="24"/><circle cx="209.5" cy="220" r="24"/>
  </g>
  <g fill="#fff">
    <circle cx="400" cy="110" r="8"/><circle cx="590.5" cy="220" r="8"/><circle cx="590.5" cy="440" r="8"/>
    <circle cx="400" cy="550" r="8"/><circle cx="209.5" cy="440" r="8"/><circle cx="209.5" cy="220" r="8"/>
  </g>

  <!-- wordmark -->
  <text x="400" y="662" text-anchor="middle" font-family="Montserrat, 'Segoe UI', Arial, sans-serif" font-size="68" font-weight="700" fill="#0f2147">Inventory Audit</text>
  <text x="400" y="715" text-anchor="middle" font-family="Montserrat, 'Segoe UI', Arial, sans-serif" font-size="26" font-weight="600" letter-spacing="9" fill="#22a866">BLOCKCHAIN LEDGER</text>
</svg>
