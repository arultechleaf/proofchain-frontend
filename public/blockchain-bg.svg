<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eef6ff"/>
      <stop offset="0.55" stop-color="#e8f6f0"/>
      <stop offset="1" stop-color="#e3ecfa"/>
    </linearGradient>
    <linearGradient id="top" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#22a866"/><stop offset="1" stop-color="#127a52"/></linearGradient>
    <linearGradient id="left" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#16376a"/><stop offset="1" stop-color="#0c1b3d"/></linearGradient>
    <linearGradient id="right" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#157a58"/><stop offset="1" stop-color="#0f4f5c"/></linearGradient>
    <g id="blk">
      <polygon points="0,0 69,40 0,80 -69,40" fill="url(#top)"/>
      <polygon points="-69,40 0,80 0,160 -69,120" fill="url(#left)"/>
      <polygon points="0,80 69,40 69,120 0,160" fill="url(#right)"/>
    </g>
    <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M60 0H0V60" fill="none" stroke="#0f2a50" stroke-opacity=".05" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#grid)"/>

  <!-- node network -->
  <g stroke="#22a866" stroke-opacity=".35" stroke-width="2" fill="none">
    <polyline points="80,140 260,260 470,170 700,300 930,190 1180,320 1420,200 1540,330"/>
    <polyline points="120,720 330,610 540,740 780,630 1010,760 1250,650 1480,760"/>
    <polyline points="260,260 330,610"/>
    <polyline points="700,300 780,630"/>
    <polyline points="1180,320 1250,650"/>
    <polyline points="470,170 540,740" stroke-dasharray="4 10"/>
    <polyline points="930,190 1010,760" stroke-dasharray="4 10"/>
  </g>
  <g fill="#fff" stroke="#22a866" stroke-width="3">
    <circle cx="80" cy="140" r="9"/><circle cx="260" cy="260" r="11"/><circle cx="470" cy="170" r="9"/>
    <circle cx="700" cy="300" r="12"/><circle cx="930" cy="190" r="9"/><circle cx="1180" cy="320" r="11"/>
    <circle cx="1420" cy="200" r="9"/><circle cx="1540" cy="330" r="8"/>
    <circle cx="120" cy="720" r="8"/><circle cx="330" cy="610" r="11"/><circle cx="540" cy="740" r="9"/>
    <circle cx="780" cy="630" r="12"/><circle cx="1010" cy="760" r="9"/><circle cx="1250" cy="650" r="11"/>
    <circle cx="1480" cy="760" r="9"/>
  </g>

  <!-- chained blocks -->
  <g opacity=".5" stroke="#fff" stroke-width="5" stroke-linejoin="round">
    <use href="#blk" transform="translate(190 380) scale(.55)"/>
    <use href="#blk" transform="translate(330 330) scale(.4)"/>
    <use href="#blk" transform="translate(1380 520) scale(.55)"/>
    <use href="#blk" transform="translate(1240 470) scale(.4)"/>
    <use href="#blk" transform="translate(1480 90) scale(.32)"/>
    <use href="#blk" transform="translate(110 520) scale(.32)"/>
  </g>
  <g fill="none" stroke="#0f2a50" stroke-opacity=".4" stroke-width="5" stroke-linecap="round">
    <rect x="248" y="400" width="44" height="18" rx="9" transform="rotate(-27 270 409)"/>
    <rect x="1318" y="520" width="44" height="18" rx="9" transform="rotate(-27 1340 529)"/>
  </g>

  <!-- floating hash text -->
  <g font-family="'Courier New', monospace" font-size="15" fill="#0f2a50" fill-opacity=".14">
    <text x="60" y="60">0x5FbDB231…0aa3</text>
    <text x="1250" y="70">a25b5237…e316d</text>
    <text x="640" y="860">block #100482 ✓ verified</text>
    <text x="1180" y="860">sha256 · 4bbd4c4a…ef0aa</text>
    <text x="70" y="860">chainId 1337</text>
  </g>
</svg>
