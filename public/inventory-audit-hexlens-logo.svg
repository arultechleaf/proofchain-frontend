<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <rect width="800" height="800" fill="#ffffff"/>

  <!-- hexagon lens: the "audit" magnifier is a block-shaped ring -->
  <polygon points="400,110 590.5,220 590.5,440 400,550 209.5,440 209.5,220" fill="#f1faf5" stroke="#0f2a50" stroke-width="22" stroke-linejoin="round"/>
  <polygon points="400,150 556,240 556,420 400,510 244,420 244,240" fill="none" stroke="#22a866" stroke-width="3" stroke-dasharray="4 10" stroke-linecap="round"/>

  <!-- network links from each node to the block -->
  <g stroke="#22a866" stroke-width="4" opacity=".7" stroke-linecap="round">
    <line x1="400" y1="110" x2="400" y2="230"/>
    <line x1="209.5" y1="220" x2="313" y2="280"/>
    <line x1="590.5" y1="220" x2="487" y2="280"/>
    <line x1="209.5" y1="440" x2="313" y2="380"/>
    <line x1="590.5" y1="440" x2="487" y2="380"/>
    <line x1="400" y1="550" x2="400" y2="430"/>
  </g>

  <!-- inventory block -->
  <polygon points="400,230 487,280 400,330 313,280" fill="#22a866"/>
  <polygon points="313,280 400,330 400,430 313,380" fill="#0f2a50"/>
  <polygon points="400,330 487,280 487,380 400,430" fill="#127a52"/>
  <g transform="translate(400 330) skewY(-30)" fill="#fff">
    <rect x="14" y="26" width="52" height="8" rx="4" opacity=".85"/>
    <rect x="14" y="46" width="32" height="8" rx="4" opacity=".55"/>
  </g>
  <g transform="translate(400 330) skewY(30)" fill="#fff">
    <rect x="-66" y="26" width="52" height="8" rx="4" opacity=".85"/>
    <rect x="-66" y="46" width="32" height="8" rx="4" opacity=".55"/>
  </g>
  <path d="M374 282 L393 302 L428 258" fill="none" stroke="#fff" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- chain-link handle -->
  <g fill="none" stroke-width="9" stroke-linecap="round">
    <g transform="translate(630 480) rotate(45)"><rect x="-34" y="-12" width="68" height="24" rx="12" stroke="#0f2a50"/></g>
    <g transform="translate(657 507) rotate(45)"><rect x="-34" y="-12" width="68" height="24" rx="12" stroke="#22a866"/></g>
  </g>
  <circle cx="692" cy="542" r="15" fill="#0f2a50"/>

  <!-- vertex nodes (network of blocks) -->
  <g fill="#22a866" stroke="#fff" stroke-width="6">
    <circle cx="400" cy="110" r="24"/>
    <circle cx="590.5" cy="220" r="24"/>
    <circle cx="590.5" cy="440" r="24"/>
    <circle cx="400" cy="550" r="24"/>
    <circle cx="209.5" cy="440" r="24"/>
    <circle cx="209.5" cy="220" r="24"/>
  </g>
  <g fill="#fff">
    <circle cx="400" cy="110" r="8"/><circle cx="590.5" cy="220" r="8"/><circle cx="590.5" cy="440" r="8"/>
    <circle cx="400" cy="550" r="8"/><circle cx="209.5" cy="440" r="8"/><circle cx="209.5" cy="220" r="8"/>
  </g>

  <!-- wordmark -->
  <text x="400" y="662" text-anchor="middle" font-family="Montserrat, 'Segoe UI', Arial, sans-serif" font-size="68" font-weight="700" fill="#0f2147">Inventory Audit</text>
  <text x="400" y="715" text-anchor="middle" font-family="Montserrat, 'Segoe UI', Arial, sans-serif" font-size="26" font-weight="600" letter-spacing="9" fill="#22a866">BLOCKCHAIN LEDGER</text>
</svg>
